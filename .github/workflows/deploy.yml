name: Deploy money journal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static app and verified OCR models
        shell: bash
        run: |
          mkdir -p dist/vendor/lang
          cp index.html app.js core.js extra-core.js extra-ui.js cloud.js google-client.js privacy.html ocr.js style.css anime.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png anime-hero.webp GOOGLE-DRIVE-SETUP.md dist/
          touch dist/.nojekyll
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js' -o 'dist/vendor/tesseract.min.js'
          echo '10fff78484067759c43028a02a72d76d0b90eb17302bb23b58a9ec5410bc928b  dist/vendor/tesseract.min.js' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js' -o 'dist/vendor/worker.min.js'
          echo '38645599043239c0eb6db08a6504a92dcdc292200535f3e9339cd77c4443b842  dist/vendor/worker.min.js' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-lstm.wasm.js' -o 'dist/vendor/tesseract-core-lstm.wasm.js'
          echo '775a35df6f2ae100e02609443e6bd5cafcd07983dd6175454ca4a432a7730687  dist/vendor/tesseract-core-lstm.wasm.js' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-simd-lstm.wasm.js' -o 'dist/vendor/tesseract-core-simd-lstm.wasm.js'
          echo '9d7c43fb206dc9f48475228b46bf35f888fa9e6259da2e67d5a75c77049f2dc7  dist/vendor/tesseract-core-simd-lstm.wasm.js' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-lstm.wasm' -o 'dist/vendor/tesseract-core-lstm.wasm'
          echo '220e2e87551edccb85519796a170469f8ab2a8055216789e3b8b1ada18b7bc2b  dist/vendor/tesseract-core-lstm.wasm' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-simd-lstm.wasm' -o 'dist/vendor/tesseract-core-simd-lstm.wasm'
          echo '187d76742dfc0d8929f0b49a619f145bb6370730776c7bd0d3e20c6b2098808d  dist/vendor/tesseract-core-simd-lstm.wasm' | sha256sum --check
          curl --fail --location --retry 3 'https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz' -o 'dist/vendor/lang/eng.traineddata.gz'
          echo 'ed350f3752f81ee8f38769edc14d92d997dababe23b565c59879372cc46a2468  dist/vendor/lang/eng.traineddata.gz' | sha256sum --check
          curl --fail --location --retry 3 'https://tessdata.projectnaptha.com/4.0.0/tha.traineddata.gz' -o 'dist/vendor/lang/tha.traineddata.gz'
          echo '578c50034028340f2558fafb55207347943a60f4f1a854e5326ac272c764f7c3  dist/vendor/lang/tha.traineddata.gz' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/LICENSE.md' -o 'dist/vendor/LICENSE-tesseract.txt'
          echo 'b40930bbcf80744c86c46a12bc9da056641d722716c378f5659b9e555ef833e1  dist/vendor/LICENSE-tesseract.txt' | sha256sum --check
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/LICENSE' -o 'dist/vendor/LICENSE-core.txt'
          echo 'c6596eb7be8581c18be736c846fb9173b69eccf6ef94c5135893ec56bd92ba08  dist/vendor/LICENSE-core.txt' | sha256sum --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
